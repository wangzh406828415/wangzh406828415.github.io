<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐳</text></svg>" />
<style>
  :root {
    --bg: #f6f7f9;
    --bg-card: #ffffff;
    --fg: #16181d;
    --fg-dim: #5b6270;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, .10);
    --border: #e6e8ec;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px -12px rgba(16,24,40,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --bg-card: #12151c;
      --fg: #eef1f6;
      --fg-dim: #9aa3b2;
      --accent: #6ea0ff;
      --accent-soft: rgba(110, 160, 255, .14);
      --border: #1f2531;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 48px -24px rgba(0,0,0,.7);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }
  /* 背景光晕 */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 420px; height: 420px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }
  body::before { background: var(--accent-soft); top: -140px; left: -120px; }
  body::after  { background: rgba(168, 85, 247, .12); bottom: -160px; right: -140px; }

  .card {
    position: relative;
    z-index: 1;
    width: min(560px, 100%);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: var(--shadow);
    text-align: center;
    animation: rise .6s cubic-bezier(.22,.8,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 3px solid var(--bg-card);
    outline: 1px solid var(--border);
    object-fit: cover;
    background: var(--accent-soft);
    margin: 0 auto 18px;
    display: block;
  }

  h1 {
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 10px;
    letter-spacing: -.01em;
  }
  .bio {
    color: var(--fg-dim);
    font-size: 15px;
    line-height: 1.7;
    margin: 0 auto 26px;
    max-width: 42ch;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 26px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .btn:hover { background: var(--accent-soft); border-color: transparent; transform: translateY(-1px); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 6px 18px -6px var(--accent);
  }
  .btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 0 22px;
  }

  .tech {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .chip {
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--fg-dim);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 4px 9px;
  }

  footer {
    color: var(--fg-dim);
    font-size: 12.5px;
    letter-spacing: .01em;
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }

  @media (max-width: 480px) {
    .card { padding: 32px 22px 26px; border-radius: 16px; }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
